# Qwen3.8-Flash-Next-FP4 on an NVIDIA DGX Spark (GB10, SM121), b12x vLLM image.
# Register the weights as "Qwen3.8-Flash-Next-FP4-Local" in the Weights tab, or change `weights:`.
# Paste this file into Recipes -> Import; omitted settings come from the vLLM preset.
# The b12x flags and the 524k context are tuned for the Spark's 128 GB unified memory.
# On other GPUs: lower --gpu-memory-utilization / --max-model-len and drop the b12x flags.
# Compact recipe file (Local LLM Manager): paste into Recipes -> Import.
name: qwen38-flash-next-fp4
description: 'Starter: nvidia/Qwen3.8-Flash-Next-FP4-Local on NVIDIA DGX Spark (GB10,
  SM121)'
framework: vllm
image: eugr/spark-vllm-b12x:latest
command: serve {model} --host 0.0.0.0 --port {port}
docker_args: --network host --ipc host --shm-size 16g --ulimit memlock=-1 --ulimit
  stack=67108864 --security-opt seccomp=unconfined --security-opt apparmor=unconfined
  --entrypoint vllm
args: |-
  --served-model-name qwen38-flash-next-fp4
  --tensor-parallel-size 1
  --pipeline-parallel-size 1
  --dtype bfloat16
  --quantization modelopt_mixed
  --load-format b12x
  --gpu-memory-utilization 0.89
  --max-model-len 524288
  --max-num-seqs 7
  --max-num-batched-tokens 16384
  --kv-cache-dtype fp8
  --block-size 16
  --mamba-cache-mode align
  --linear-backend b12x
  --moe-backend b12x
  --gdn-decode-kernel b12x
  --disable-uvicorn-access-log
  --optimization-level 3
  --performance-mode throughput
  --hf-overrides '{"max_position_embeddings":524288,"text_config":{"max_position_embeddings":524288,"rope_parameters":{"rope_type":"yarn","factor":2,"original_max_position_embeddings":262144,"mrope_interleaved":true,"mrope_section":[11,11,10],"rope_theta":10000000,"partial_rotary_factor":0.25}}}'
  --enable-prefix-caching
  --enable-chunked-prefill
  --compilation-config '{"pass_config":{"fuse_act_quant":true}}'
  --enable-auto-tool-choice
  --tool-call-parser qwen3_coder
  --reasoning-parser qwen3
  --speculative-config '{"method":"mtp","num_speculative_tokens":4}'
env: |-
  HF_HUB_OFFLINE=1
  TOKENIZERS_PARALLELISM=false
  VLLM_PLE_TABLE_MEMORY=disk
  B12X_DISK_BACKEND=io_uring
  CUTE_DSL_ARCH=sm_121a
  SAFETENSORS_FAST_GPU=1
  VLLM_WORKER_MULTIPROC_METHOD=spawn
  VLLM_SSM_CONV_STATE_LAYOUT=DS
  VLLM_USE_AOT_COMPILE=1
  VLLM_USE_MEGA_AOT_ARTIFACT=1
  VLLM_USE_V2_MODEL_RUNNER=1
  B12X_POLICY_MODE=auto
  VLLM_MXFP8_LM_HEAD=1
  VLLM_B12X_MOE_FP4_LAYER_MAX_INPUT_SCALE=w13
  VLLM_B12X_MOE_FP4_FORCE_A16=1
  B12X_W4A16_A4_PREFILL=1
  OMP_NUM_THREADS=2
  PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  VLLM_CACHE_ROOT=/root/.cache/vllm
  B12X_CACHE_DIR=/root/.cache/b12x
  TRITON_CACHE_DIR=/root/.triton/cache
  VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
  TRANSFORMERS_VERBOSITY=error
  TRANSFORMERS_NO_ADVISORY_WARNINGS=1
volumes: |-
  ~/.cache/huggingface:/root/.cache/huggingface
  ~/.cache/vllm:/root/.cache/vllm
  ~/.cache/flashinfer:/root/.cache/flashinfer
  ~/.cache/triton:/root/.triton/cache
  ~/.cache/b12x:/root/.cache/b12x
host_port: 8081
container_port: 8081
weights: Qwen3.8-Flash-Next-FP4-Local
container_name: qwen38-flash-next
color: red
