# Qwen3.8-Flash-Next-FP4 served by SGLang on an NVIDIA DGX Spark (GB10, SM121).
# Register the weights as "Qwen3.8-Flash-Next-FP4-Local" in the Weights tab, or change `weights:`.
# Paste this file into Recipes -> Import; the SGLang preset fills in the command,
# Docker flags, Hugging Face cache volume and HF_TOKEN.
# The b12x flags in qwen38-flash-next-fp4.yaml are vLLM-specific; this is the SGLang
# equivalent with a conservative 32k context. Raise --context-length for longer prompts.
# Same endpoint and served model name as the vLLM example, so agents can switch frameworks.
name: qwen38-flash-next-sglang
framework: sglang
weights: Qwen3.8-Flash-Next-FP4-Local
host_port: 8081
args: |
  --mem-fraction-static 0.4
  --context-length 32768
  --served-model-name qwen38-flash-next-fp4
