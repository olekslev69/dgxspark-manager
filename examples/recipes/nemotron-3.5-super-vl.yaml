# Nemotron-3.5-Super-VL with a draft model for speculative decoding.
# Register the parent folder that holds both models (e.g. ~/models) as "Nemotron-3.5-Models"
# in the Weights tab, or change `weights:` and the /models paths below.
# Paste this file into Recipes -> Import; the vLLM preset fills in the command,
# Docker flags, Hugging Face cache volume and HF_TOKEN.
# The image must be a vLLM build with dflash and the mamba flags; adjust the tag.
name: nemotron-3.5-super-vl
framework: vllm
image: vllm/vllm-openai:v0.32.0
weights: Nemotron-3.5-Models
model: /models/Nemotron-3.5-Super-VL
host_port: 8100
args: |
  --served-model-name nemotron-3.5-super-vl
  --max-num-seqs 1
  --trust-remote-code
  --gpu-memory-utilization 0.75
  --max-num-batched-tokens 8192
  --speculative-config.model /models/Nemotron-3.5-Super-VL-Draft
  --speculative-config.num_speculative_tokens 7
  --speculative-config.method dflash
  --mamba-backend flashinfer
  --mamba-ssm-cache-dtype float16
  --enable-mamba-cache-stochastic-rounding
  --mamba-cache-philox-rounds 5
  --enable-mamba-shared-prefix-checkpoint
  --video-pruning-rate 0.5
  --media-io-kwargs '{"video": {"fps": 2, "num_frames": 256}}'
  --block-size 64
  --prefix-match-unit 64
  --enable-auto-tool-choice
  --tool-call-parser qwen3_coder
  --reasoning-parser nemotron_v3
volumes: |-
  {weights}:/models:ro
  ~/.cache/huggingface:/root/.cache/huggingface
